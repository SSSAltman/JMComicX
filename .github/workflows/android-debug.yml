name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android 的默认 packages 含 'tools'，而 Google 已下架该包，
          # 保留默认值会让这一步以 "Failed to find package 'tools'" 直接失败。
          packages: platform-tools

      - name: Install Android platform
        run: |
          set +e
          echo "== 镜像已装的 platforms / build-tools =="
          ls -1 "$ANDROID_HOME/platforms" 2>/dev/null
          ls -1 "$ANDROID_HOME/build-tools" 2>/dev/null
          echo "== 远端可用的 35~39 候选包名 =="
          sdkmanager --list 2>/dev/null | grep -oE "(platforms;android|build-tools);3[5-9][0-9.]*" | sort -u
          echo "== 逐个试装（app/build.gradle.kts 用的是 release(37){minorApiLevel=0}，包名可能带小版本）=="
          for pkg in "platforms;android-37" "platforms;android-37.0" "platforms;android-37.0.0"; do
            echo "-- try $pkg"
            if sdkmanager --install "$pkg" "build-tools;37.0.0"; then
              echo "INSTALLED with $pkg"
              break
            fi
          done
          echo "== 预览通道兜底 =="
          sdkmanager --channel=1 --install "platforms;android-37" "build-tools;37.0.0" || true
          echo "== 最终落地状态 =="
          ls -1 "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Test and build debug APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JMComicX-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
